name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      # HA shows the manifest version, not the tag, so a release whose manifest
      # was not bumped reports the wrong version to users. A prerelease suffix
      # (v0.1.3-rc1) is ignored, so release candidates can carry the final version.
      - name: "Check the manifest version matches the release tag"
        shell: "bash"
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          expected="${expected%%-*}"
          actual="$(jq -r .version custom_components/intelbras_solar/manifest.json)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error file=custom_components/intelbras_solar/manifest.json::manifest version ${actual} does not match release tag ${TAG}; bump it before releasing"
            exit 1
          fi

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/intelbras_solar"
          zip intelbras_solar.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: "softprops/action-gh-release@v3.0.3"
        with:
          files: ${{ github.workspace }}/custom_components/intelbras_solar/intelbras_solar.zip
